<style>:root{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>

<body>
<title>Equity</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400..800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout concept: your life as an investment portfolio. Each area of life is a holding with a ticker and a price (its score),
   the Life Index is the market, rituals are orders you execute, goals are earnings dates. Terminal-grade restraint: one ink, green up, red down. */
:root{
  --bg:#0A0B0D; --p1:#111316; --p2:#16191D; --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.13);
  --ink:#EDEEF0; --mute:#8A8F98; --faint:#4E535C; --up:#2BD576; --down:#FF5A5F; --acc:#2BD576; --inv:#0A0B0D;
  --sans:"Schibsted Grotesk","Helvetica Neue","Segoe UI",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --ease:cubic-bezier(.16,1,.3,1); --spring:cubic-bezier(.3,1.35,.5,1);
  --gx:max(16px,env(safe-area-inset-left,0px)); --gxr:max(16px,env(safe-area-inset-right,0px));
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#F5F5F3;--p1:#FFFFFF;--p2:#F0F0EE;--line:rgba(10,12,16,.08);--line2:rgba(10,12,16,.15);--ink:#0E0F12;--mute:#5F636B;--faint:#A6A9AF;--up:#0A9E52;--down:#E03E44;--acc:#0A9E52;--inv:#FFFFFF;color-scheme:light}}
:root[data-theme="light"]{--bg:#F5F5F3;--p1:#FFFFFF;--p2:#F0F0EE;--line:rgba(10,12,16,.08);--line2:rgba(10,12,16,.15);--ink:#0E0F12;--mute:#5F636B;--faint:#A6A9AF;--up:#0A9E52;--down:#E03E44;--acc:#0A9E52;--inv:#FFFFFF;color-scheme:light}
.app[data-mode="night"]{--bg:#0A0B0D;--p1:#111316;--p2:#16191D;--line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.13);--ink:#EDEEF0;--mute:#8A8F98;--faint:#4E535C;--up:#2BD576;--down:#FF5A5F;--acc:#2BD576;--inv:#0A0B0D;color-scheme:dark}
.app[data-mode="day"]{--bg:#F5F5F3;--p1:#FFFFFF;--p2:#F0F0EE;--line:rgba(10,12,16,.08);--line2:rgba(10,12,16,.15);--ink:#0E0F12;--mute:#5F636B;--faint:#A6A9AF;--up:#0A9E52;--down:#E03E44;--acc:#0A9E52;--inv:#FFFFFF;color-scheme:light}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;touch-action:manipulation}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eb{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.up{color:var(--up)}.down{color:var(--down)}
.app{position:fixed;inset:0;background:var(--bg);overflow:hidden}
.scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.wrap{max-width:1240px;margin:0 auto;padding:0 var(--gxr) calc(48px + env(safe-area-inset-bottom,0px)) var(--gx)}

/* header */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;margin:0 calc(-1*var(--gxr)) 0 calc(-1*var(--gx));padding:calc(10px + env(safe-area-inset-top,0px)) var(--gxr) 10px var(--gx);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.mark{width:30px;height:30px;flex:none;display:grid;place-items:center;border-radius:8px;background:var(--ink);color:var(--inv)}
.mark svg{width:18px;height:18px}
.mark path{stroke-dasharray:40;stroke-dashoffset:40;animation:draw 1.4s var(--ease) .2s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.brand{display:flex;flex-direction:column;min-width:0;flex:1}
.brand b{font-weight:700;font-size:17px;letter-spacing:-.01em;line-height:1.1}
.status{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10.5px;color:var(--mute);letter-spacing:.04em;white-space:nowrap}
.status i{width:6px;height:6px;border-radius:50%;background:var(--up);box-shadow:0 0 0 0 color-mix(in srgb,var(--up) 60%,transparent);animation:live 2s infinite}
@keyframes live{70%{box-shadow:0 0 0 6px color-mix(in srgb,var(--up) 0%,transparent)}}
.sync{width:7px;height:7px;border-radius:50%;background:var(--faint);flex:none}
.sync[data-s="ok"]{background:var(--up)}.sync[data-s="saving"]{background:#F5B83D}.sync[data-s="demo"]{background:#7C8CFF}
.ibtn{height:36px;padding:0 12px;border-radius:9px;border:1px solid var(--line2);display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;transition:background .2s,transform .2s}
.ibtn:active{transform:scale(.95)}
.ibtn svg{width:15px;height:15px}

/* tape */
.tape{margin:0 calc(-1*var(--gxr)) 0 calc(-1*var(--gx));border-bottom:1px solid var(--line);overflow:hidden;white-space:nowrap;height:34px;display:flex;align-items:center;-webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.tape-in{display:inline-flex;gap:28px;padding-left:28px;animation:tape 40s linear infinite;font-family:var(--mono);font-size:12px}
.tape:hover .tape-in{animation-play-state:paused}
.tape-in span{display:inline-flex;gap:8px}
.tape-in b{font-weight:600}
@keyframes tape{to{transform:translateX(-50%)}}

/* grid */
.grid{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;margin-top:14px}
.panel{background:var(--p1);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0;animation:rise .8s var(--ease) both;animation-delay:var(--d,0s)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.ph-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.ph-h h2{margin:0;font-size:15px;font-weight:700;letter-spacing:-.005em}
@media (min-width:1000px){.grid{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);align-items:start}.col{display:flex;flex-direction:column;gap:14px;min-width:0}}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}

/* index hero */
.idx-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap}
.price{font-family:var(--mono);font-weight:500;font-size:clamp(46px,13vw,68px);line-height:1;letter-spacing:-.04em;display:flex;align-items:flex-end;margin:6px 0 8px}
.odo{display:inline-flex;align-items:flex-start;overflow:hidden;height:1em;line-height:1}
.odo .dg{flex:none;height:10em;display:inline-flex;flex-direction:column;transition:transform 1s var(--ease);will-change:transform}
.odo .dg span{height:1em;line-height:1;flex:none}
.odo .sep{display:inline-block}
.price.flash-up{animation:fu 1.2s ease}.price.flash-down{animation:fd 1.2s ease}
@keyframes fu{20%{color:var(--up)}}@keyframes fd{20%{color:var(--down)}}
.chg{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:14px;font-weight:500}
.chg .pill{padding:3px 8px;border-radius:6px;background:color-mix(in srgb,currentColor 14%,transparent);font-size:12.5px}
.seg{display:inline-flex;background:var(--p2);border:1px solid var(--line);border-radius:9px;padding:3px;position:relative;isolation:isolate}
.seg .ink{position:absolute;top:3px;bottom:3px;left:0;width:0;border-radius:7px;background:var(--ink);z-index:-1;transition:left .45s var(--spring),width .45s var(--spring)}
.seg button{height:28px;padding:0 11px;border-radius:7px;font-family:var(--mono);font-size:11.5px;font-weight:500;color:var(--mute);transition:color .3s}
.seg button[aria-pressed="true"]{color:var(--inv)}
.chartbox{position:relative;height:clamp(200px,42vw,300px);margin:14px -4px 0;touch-action:pan-y}
.chartbox canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.xh{position:absolute;top:0;pointer-events:none;padding:6px 9px;border-radius:7px;background:var(--ink);color:var(--inv);font-family:var(--mono);font-size:11.5px;white-space:nowrap;transform:translateX(-50%);opacity:0;transition:opacity .15s}
.xh.on{opacity:1}
.ctl{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:12px;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;margin-top:14px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.kpi{background:var(--p1);padding:10px 12px;min-width:0}
.kpi b{display:block;font-family:var(--mono);font-size:16px;font-weight:500;white-space:nowrap}
.kpi span{font-size:11px;color:var(--mute)}

/* heatmap */
.heat{position:relative;height:clamp(220px,58vw,320px);border-radius:10px;overflow:hidden}
.tile{position:absolute;padding:8px 9px;display:flex;flex-direction:column;justify-content:space-between;color:#fff;text-align:left;overflow:hidden;border:1px solid var(--bg);border-radius:6px;transition:filter .2s,transform .35s var(--spring);animation:tileIn .7s var(--ease) both;animation-delay:calc(var(--i)*55ms + .2s)}
.tile:hover{filter:brightness(1.12)}.tile:active{transform:scale(.97)}
@keyframes tileIn{from{opacity:0;transform:scale(.85)}}
.tile b{font-family:var(--mono);font-size:13px;font-weight:600;letter-spacing:.02em}
.tile small{font-size:11px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile em{font-style:normal;font-family:var(--mono);font-size:12px;font-weight:500}
.tile.big b{font-size:16px}.tile.big em{font-size:14px}
.legend{display:flex;align-items:center;gap:6px;margin-top:10px;font-family:var(--mono);font-size:10px;color:var(--mute)}
.legend i{flex:1;height:6px;border-radius:3px;background:linear-gradient(90deg,#B3363B,#3A3D44 50%,#18A65A)}

/* orders */
.orders{display:flex;flex-direction:column}
.ord{position:relative;display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.ord:first-child{border-top:0}
.tk{font-family:var(--mono);font-size:10.5px;font-weight:600;padding:5px 0;border-radius:5px;text-align:center;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c)}
.on{min-width:0}
.on b{display:block;font-size:14.5px;font-weight:600;overflow-wrap:anywhere}
.on span{font-family:var(--mono);font-size:11px;color:var(--mute)}
.exec{position:relative;overflow:hidden;min-width:96px;height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--line2);font-family:var(--mono);font-size:11.5px;font-weight:600;letter-spacing:.06em;isolation:isolate;transition:border-color .3s,color .3s,transform .2s}
.exec::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--up);transform:scaleX(0);transform-origin:left;transition:transform .55s var(--ease)}
.exec[aria-pressed="true"]{color:#04150B;border-color:var(--up)}
.exec[aria-pressed="true"]::before{transform:scaleX(1)}
.exec:active{transform:scale(.95)}
.exec .l1,.exec .l2{display:block;transition:transform .45s var(--spring),opacity .3s}
.exec .l2{position:absolute;inset:0;display:grid;place-items:center;transform:translateY(100%);opacity:0}
.exec[aria-pressed="true"] .l1{transform:translateY(-100%);opacity:0}
.exec[aria-pressed="true"] .l2{transform:none;opacity:1}
.stamp{position:absolute;right:110px;top:50%;font-family:var(--mono);font-size:11px;font-weight:600;color:var(--up);border:1.5px solid var(--up);padding:2px 6px;border-radius:4px;transform:translateY(-50%) rotate(-8deg) scale(1.6);opacity:0;pointer-events:none;animation:stamp 1.4s var(--ease) forwards}
@keyframes stamp{15%{opacity:1;transform:translateY(-50%) rotate(-8deg) scale(1)}75%{opacity:1}100%{opacity:0;transform:translateY(-60%) rotate(-8deg) scale(1)}}
.fill{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.fillbar{flex:1;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.fillbar i{display:block;height:100%;width:var(--w);background:var(--up);transition:width .8s var(--ease)}

/* watchlist */
.wl{display:flex;flex-direction:column}
.wr{display:grid;grid-template-columns:minmax(0,1fr) 72px 84px;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);text-align:left;width:100%;transition:background .2s;animation:rise .6s var(--ease) both;animation-delay:calc(var(--i)*40ms + .3s)}
.wr:first-child{border-top:0}
.wr:hover{background:color-mix(in srgb,var(--ink) 3%,transparent)}
.wn{display:flex;align-items:center;gap:10px;min-width:0}
.wn .tk{width:46px;flex:none}
.wn span{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wr svg{width:72px;height:28px;overflow:visible}
.wp{text-align:right;font-family:var(--mono)}
.wp b{display:block;font-size:14px;font-weight:500}
.wp span{display:inline-block;margin-top:2px;font-size:11px;padding:1px 6px;border-radius:4px;background:color-mix(in srgb,currentColor 14%,transparent)}
.addrow{margin-top:8px;width:100%;height:40px;border-radius:9px;border:1px dashed var(--line2);color:var(--mute);font-size:13px;font-weight:600}

/* earnings */
.earn{display:flex;flex-direction:column}
.er{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.er:first-child{border-top:0}
.cal{border:1px solid var(--line2);border-radius:8px;text-align:center;overflow:hidden}
.cal small{display:block;font-family:var(--mono);font-size:9.5px;background:var(--c);color:#fff;padding:2px 0;letter-spacing:.08em}
.cal b{display:block;font-family:var(--mono);font-size:17px;font-weight:500;padding:3px 0}
.er p{margin:0;font-size:14px;line-height:1.35;overflow-wrap:anywhere}
.er em{font-style:normal;font-family:var(--mono);font-size:11px;color:var(--mute)}

/* journal photo, sheets and shared parts */
.ph{display:grid;grid-template-columns:104px minmax(0,1fr);gap:14px;align-items:start}
.ph-frame{position:relative;width:104px;aspect-ratio:4/5;border-radius:10px;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;max-width:100%}
.ph-frame img{width:100%;height:100%;object-fit:cover;display:block}
.ph-take{border:1px dashed var(--line2);background:var(--p2);cursor:pointer}
.ph-take b{font-size:12px;font-weight:600;line-height:1.2;padding:0 8px}
.ph-cam{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--ink);color:var(--inv)}
.ph-cam svg{width:18px;height:18px}
.ph-frame.flash::after{content:"";position:absolute;inset:0;background:#fff;animation:flash .7s forwards}
@keyframes flash{from{opacity:.9}to{opacity:0}}
.ph-in{position:absolute;inset:0;opacity:0;width:100%;height:100%;font-size:0;cursor:pointer}
.ph-side{display:flex;flex-direction:column;gap:10px;min-width:0}
.ph-side p{margin:0;font-size:13.5px;line-height:1.5;color:var(--mute)}
.ph-strip{grid-column:1/-1;display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:3px}
.ph-th{position:relative;aspect-ratio:3/4;border-radius:4px;overflow:hidden;max-width:100%;background:var(--p2)}
.ph-th img{width:100%;height:100%;object-fit:cover;display:block}
.ph-th.emp{background:transparent;border:1px dashed var(--line2)}
.ph-th.td{border-color:var(--ink)}
.ph-load{background:linear-gradient(100deg,var(--line) 30%,var(--line2) 50%,var(--line) 70%);background-size:300% 100%;animation:shim 1.4s linear infinite}
@keyframes shim{to{background-position:-150% 0}}
.veil{position:absolute;inset:0;z-index:50;background:rgba(0,0,0,.5);opacity:0;transition:opacity .3s}
.veil.on{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:51;max-height:94%;display:flex;flex-direction:column;background:var(--p1);border-top:1px solid var(--line2);border-radius:16px 16px 0 0;transform:translateY(105%);transition:transform .5s var(--ease);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.on{transform:none}.sheet.drag{transition:none}
.grab{padding:10px 0 4px;display:flex;justify-content:center;touch-action:none;cursor:grab;flex:none}
.grab i{width:40px;height:4px;border-radius:4px;background:var(--line2)}
.sbody{overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:0 var(--gxr) 26px var(--gx)}
.s-hd{display:flex;align-items:center;gap:12px;padding:6px 0 14px}
.s-orb{width:4px;align-self:stretch;border-radius:2px;background:var(--c);flex:none}
.s-hd h2{margin:0;font-size:24px;font-weight:700;letter-spacing:-.02em;outline:none;overflow-wrap:anywhere}
.s-hd p{margin:2px 0 0;font-family:var(--mono);font-size:12px;color:var(--mute)}
.xbtn{margin-left:auto;width:36px;height:36px;border-radius:9px;border:1px solid var(--line2);display:grid;place-items:center;flex:none}
.xbtn svg{width:14px;height:14px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.st{background:var(--p1);padding:10px;text-align:left}
.st b{display:block;font-family:var(--mono);font-size:17px;font-weight:500}
.st span{font-size:10.5px;color:var(--mute)}
.hchart{position:relative;height:180px;margin:14px -2px 0}
.hchart canvas{position:absolute;inset:0;width:100%;height:100%}
.tabs{position:sticky;top:0;z-index:3;display:flex;gap:2px;padding:10px 0;margin-top:10px;background:var(--p1);border-bottom:1px solid var(--line)}
.tabs .tk{position:absolute;bottom:-1px;top:auto;height:2px;left:0;width:0;border-radius:0;padding:0;background:var(--ink);transition:left .45s var(--spring),width .45s var(--spring)}
.tabs button{position:relative;z-index:1;flex:1;height:34px;font-size:13px;font-weight:600;color:var(--mute);transition:color .3s}
.tabs button[aria-selected="true"]{color:var(--ink)}
.tabc{padding-top:12px}
.tabc>*{animation:rise .45s var(--ease) both;animation-delay:calc(var(--i,0)*40ms)}
.card{padding:14px;border-radius:12px;background:var(--p2);border:1px solid var(--line);margin-bottom:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.field{height:42px;border-radius:9px;border:1px solid var(--line2);background:var(--bg);padding:0 12px;font-size:16px;min-width:0;transition:border-color .2s}
.field:focus{outline:none;border-color:var(--ink)}
textarea.field{height:auto;padding:10px 12px;resize:vertical}
.btn{position:relative;overflow:hidden;height:42px;padding:0 16px;border-radius:9px;background:var(--ink);color:var(--inv);font-weight:600;font-size:13.5px;display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;transition:transform .2s,opacity .2s}
.btn:active{transform:scale(.96)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line2)}
.btn.bad{background:transparent;color:var(--down);border:1px solid color-mix(in srgb,var(--down) 40%,transparent)}
.mt{display:flex;align-items:baseline;gap:8px;min-width:0}
.mt b{font-size:15px;outline:none;overflow-wrap:anywhere;min-width:0}
.pill{font-family:var(--mono);font-size:10.5px;padding:3px 7px;border-radius:5px;background:var(--line);color:var(--mute);white-space:nowrap}
.mv{font-family:var(--mono);font-size:28px;font-weight:500;letter-spacing:-.02em;margin:6px 0 2px}
.mv small{font-size:12px;color:var(--mute);margin-left:4px}
.spark2{width:100%;height:44px;display:block;margin:6px 0 10px;overflow:visible}
.hist{list-style:none;margin:8px 0 0;padding:0;max-height:180px;overflow:auto}
.hist li{display:flex;justify-content:space-between;gap:10px;align-items:center;font-family:var(--mono);font-size:12px;padding:4px 0;border-bottom:1px solid var(--line)}
.x{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--faint)}
.x svg{width:12px;height:12px}
.dots{display:grid;grid-template-columns:repeat(14,1fr);gap:3px;margin-top:12px}
.dots button{aspect-ratio:1;border-radius:3px;background:var(--line);transition:background .25s;max-width:100%}
.dots button.on{background:var(--up)}
.dots button.td{outline:1.5px solid var(--ink);outline-offset:1px}
.streak{font-family:var(--mono);font-size:11.5px;color:var(--mute);display:flex;align-items:center;gap:4px}
.streak.hot{color:var(--up)}
.fl{width:12px;height:12px;flex:none}
.ms{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center}
.chk{appearance:none;-webkit-appearance:none;width:22px;height:22px;border-radius:6px;border:1.5px solid var(--line2);margin:0;display:grid;place-items:center;cursor:pointer;transition:background .2s}
.chk:checked{background:var(--up);border-color:var(--up)}
.chk:checked::after{content:"";width:5px;height:10px;border:solid #04150B;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.ms.done .mtx{text-decoration:line-through;color:var(--mute)}
.mtx{font-size:14.5px;outline:none;overflow-wrap:anywhere}
.sws{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:32px;height:32px;border-radius:8px;background:var(--s);border:2px solid transparent}
.sw[aria-pressed="true"]{border-color:var(--ink)}
.lbl{display:block;font-size:12px;color:var(--mute);margin:0 0 6px;font-weight:600}
.sbody .seg{display:flex;width:100%}
.sbody .seg button{flex:1;height:34px;font-family:var(--sans);font-size:13px}
.sbody .seg button[aria-pressed="true"]{background:var(--ink);color:var(--inv)}
.tgl{appearance:none;-webkit-appearance:none;width:44px;height:26px;border-radius:99px;background:var(--line2);position:relative;cursor:pointer;margin:0;transition:background .3s;flex:none}
.tgl::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .35s var(--spring)}
.tgl:checked{background:var(--up)}.tgl:checked::after{transform:translateX(18px)}
input[type=range]{width:100%;accent-color:var(--ink)}
.empty{padding:20px;text-align:center;color:var(--mute);font-size:13.5px;line-height:1.5;border:1px dashed var(--line2);border-radius:10px}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
.banner{margin-top:14px;padding:12px 14px;border-radius:12px;border:1px solid var(--line2);background:var(--p1);display:flex;flex-wrap:wrap;gap:10px;align-items:center;animation:rise .8s var(--ease) .4s both}
.banner p{margin:0;flex:1 1 220px;font-size:13.5px;line-height:1.45}
.toast{position:absolute;z-index:90;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translate(-50%,24px);opacity:0;padding:11px 16px;border-radius:10px;background:var(--ink);color:var(--inv);font-family:var(--mono);font-size:12.5px;transition:all .45s var(--spring);pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.modal{position:absolute;z-index:70;left:50%;top:50%;width:min(400px,calc(100% - 32px));transform:translate(-50%,-48%) scale(.97);opacity:0;padding:20px;border-radius:14px;background:var(--p1);border:1px solid var(--line2);transition:all .35s var(--ease)}
.modal.on{opacity:1;transform:translate(-50%,-50%)}
.modal h3{margin:0 0 6px;font-size:18px;font-weight:700}
.modal p{margin:0 0 16px;color:var(--mute);font-size:14px;line-height:1.5}
.lb{position:absolute;inset:0;z-index:66;background:var(--bg);display:flex;flex-direction:column;padding:calc(16px + env(safe-area-inset-top,0px)) var(--gxr) calc(16px + env(safe-area-inset-bottom,0px)) var(--gx);animation:fade .3s both}
@keyframes fade{from{opacity:0}}
.lb-fig{flex:1;min-height:0;margin:14px 0;display:flex;align-items:center;justify-content:center}
.lb-fig img{max-width:100%;max-height:100%;border-radius:10px;object-fit:contain}
.lb h3{margin:0;font-size:22px;font-weight:700}
.rp{position:absolute;border-radius:50%;pointer-events:none;background:currentColor;opacity:.18;transform:scale(0);animation:rp .55s ease-out forwards}
@keyframes rp{to{transform:scale(1);opacity:0}}
@media (min-width:1000px){.sheet{left:auto;right:20px;top:20px;bottom:20px;width:480px;max-height:none;border-radius:16px;border:1px solid var(--line2);transform:translateX(calc(100% + 40px))}.sheet.on{transform:none}.grab{display:none}}
@media (max-width:400px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.wr{grid-template-columns:minmax(0,1fr) 56px 76px;gap:8px}.wr svg{width:56px}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0ms!important;transition-duration:.12s!important}}
</style>

<script>
(()=>{
'use strict';
const app=document.getElementById('app');
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const RM=matchMedia('(prefers-reduced-motion: reduce)');
const pad=n=>String(n).padStart(2,'0');
const dkey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseKey=k=>{const[y,m,d]=String(k).split('-').map(Number);return new Date(y,(m||1)-1,d||1)};
const today=()=>dkey(new Date());
const addDays=(k,n)=>{const t=parseKey(k);t.setDate(t.getDate()+n);return dkey(t)};
const uid=()=>Math.random().toString(36).slice(2,10);
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const avg=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:0;

  app.append(v,m);let col=c;requestAnimationFrame(()=>{v.classList.add('on');m.classList.add('on');m.querySelector('input').focus()});const done=()=>{v.classList.remove('on');m.classList.remove('on');setTimeout(()=>{v.remove();m.remove()},400)};

function handleBind(el){const[sc,f]=el.dataset.bind.split(':');let v=el.type==='checkbox'?el.checked:(el.type==='range'||el.type==='number')?parseFloat(el.value):el.isContentEditable?el.textContent.replace(/\s+/g,' ').trim():el.value;
  if(sc==='set'){state.settings[f]=v;commit({render:false});return}
  if(sc==='profile'){state.profile[f]=String(v).slice(0,30);commit({render:false});renderTop();return}
  const d=D_(el.dataset.d);if(!d)return;
  if(sc==='d'){if(f==='name'&&!v){renderAll();return}if(f==='ticker'){d.ticker=String(v).toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,5)||undefined;commit();return}d[f]=f==='name'?String(v).slice(0,28):v;commit();if(f==='color'||f==='name')applyTheme();return}
  if(sc==='m'){const m=d.metrics.find(x=>x.id===el.dataset.m);if(!m)return;if(f==='name'&&!v){renderAll();return}if(f==='target'&&isNaN(v))v=0;m[f]=v;commit();return}
  if(sc==='h'){const h=d.habits.find(x=>x.id===el.dataset.h);if(!h||!v){renderAll();return}h.name=v;commit();return}
  if(sc==='ms'){const m=d.milestones.find(x=>x.id===el.dataset.ms);if(!m)return;if(f==='text'&&!v){renderAll();return}m[f]=v;if(f==='done'&&v){toast('Goal reached: '+m.text);haptic([10,40,10,40,20]);const b=OR.blobs.find(x=>x.id===d.id);if(b)b.kick=.12}commit()}}

document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('.lb'))$$('.lb').forEach(x=>x.remove());else if(SH.kind)closeSheet();else if(ui.focus)setFocus(null)}});
window.addEventListener('error',e=>{try{toast('Something went wrong: '+String(e.message||'').slice(0,70))}catch(_){}});



/* ---------- chart engine (line + candles, crosshair, animated) ---------- */
function makeChart(box,cv,opts){const C={box,cv,ctx:cv.getContext('2d'),vals:[],raw:[],disp:[],t0:0,hover:-1,opts};
  C.size=()=>{const r=Math.min(2,devicePixelRatio||1);cv.width=Math.round(cv.clientWidth*r);cv.height=Math.round(cv.clientHeight*r);C.r=r};
  C.set=(vals,raw,keep)=>{const old=C.disp;C.vals=vals;C.raw=raw||vals;if(keep&&old.length){C.disp=vals.map((_,i)=>{const t=i/(vals.length-1||1)*(old.length-1),a=Math.floor(t),b=Math.min(old.length-1,a+1);return old[a]+(old[b]-old[a])*(t-a)})}else C.disp=vals.map(()=>vals[0]??0);C.t0=performance.now()};
  C.draw=(now,dt)=>{const{ctx}=C,W=cv.width,H=cv.height,r=C.r||1;if(!W||!C.vals.length)return;const cs=getComputedStyle(app),ink=cs.getPropertyValue('--ink').trim(),mute=cs.getPropertyValue('--faint').trim(),line=cs.getPropertyValue('--line2').trim(),up=cs.getPropertyValue('--up').trim(),down=cs.getPropertyValue('--down').trim();
    const k=Math.min(1,dt/220);for(let i=0;i<C.vals.length;i++)C.disp[i]+=(C.vals[i]-C.disp[i])*k;
    const v=C.disp,n=v.length,padL=6*r,padR=(opts.axis?42:8)*r,padT=12*r,padB=(opts.axis?22:6)*r;let lo=Math.min(...v,...(opts.candle?C.lows():[])),hi=Math.max(...v,...(opts.candle?C.highs():[]));if(hi-lo<.04){const m=(hi+lo)/2;lo=m-.02;hi=m+.02}const pd=(hi-lo)*.12;lo=Math.max(0,lo-pd);hi=Math.min(1,hi+pd);if(hi-lo<.04)hi=lo+.04;
    const X=i=>padL+i/(n-1||1)*(W-padL-padR),Y=y=>padT+(1-(y-lo)/(hi-lo))*(H-padT-padB);ctx.clearRect(0,0,W,H);
    if(opts.axis){ctx.font=`${10*r}px ${cs.getPropertyValue('--mono')}`;ctx.fillStyle=mute;ctx.textAlign='left';ctx.textBaseline='middle';for(let g=0;g<=3;g++){const yv=lo+(hi-lo)*(g/3),yy=Y(yv);ctx.strokeStyle=line;ctx.globalAlpha=.5;ctx.setLineDash([2*r,4*r]);ctx.beginPath();ctx.moveTo(padL,yy);ctx.lineTo(W-padR,yy);ctx.stroke();ctx.setLineDash([]);ctx.globalAlpha=1;ctx.fillText((yv*100).toFixed(1),W-padR+6*r,yy)}
      const T=today(),step=Math.max(1,Math.round(n/5));ctx.textAlign='center';ctx.textBaseline='alphabetic';for(let i=n-1;i>=0;i-=step){const d2=parseKey(addDays(T,i-(n-1)));ctx.fillText(i===n-1?'Today':`${d2.getDate()} ${MON[d2.getMonth()]}`,Math.min(Math.max(X(i),24*r),W-padR-20*r),H-6*r)}}
    const rise=v[n-1]>=v[0],col=opts.color||(rise?up:down);const prog=Math.min(1,(now-C.t0)/900),ease=1-Math.pow(1-prog,3);
    ctx.save();ctx.beginPath();ctx.rect(0,0,padL+(W-padL-padR)*ease+2,H);ctx.clip();
    if(opts.candle&&C.ohlc){const cw=Math.max(1.5*r,(W-padL-padR)/n*.62);C.ohlc.forEach((c,i)=>{const x=X(i),u=c.c>=c.o;ctx.strokeStyle=ctx.fillStyle=u?up:down;ctx.lineWidth=Math.max(1,r);ctx.beginPath();ctx.moveTo(x,Y(c.h));ctx.lineTo(x,Y(c.l));ctx.stroke();const y1=Y(Math.max(c.o,c.c)),y2=Y(Math.min(c.o,c.c));ctx.fillRect(x-cw/2,y1,cw,Math.max(1.5*r,y2-y1))})}
    else{const g=ctx.createLinearGradient(0,padT,0,H-padB);g.addColorStop(0,col+'40');g.addColorStop(1,col+'00');ctx.beginPath();ctx.moveTo(X(0),Y(v[0]));for(let i=1;i<n;i++){const xm=(X(i-1)+X(i))/2;ctx.bezierCurveTo(xm,Y(v[i-1]),xm,Y(v[i]),X(i),Y(v[i]))}ctx.lineTo(X(n-1),H-padB);ctx.lineTo(X(0),H-padB);ctx.closePath();ctx.fillStyle=g;ctx.fill();
      ctx.beginPath();ctx.moveTo(X(0),Y(v[0]));for(let i=1;i<n;i++){const xm=(X(i-1)+X(i))/2;ctx.bezierCurveTo(xm,Y(v[i-1]),xm,Y(v[i]),X(i),Y(v[i]))}ctx.strokeStyle=col;ctx.lineWidth=2*r;ctx.lineJoin='round';ctx.stroke()}
    ctx.restore();
    if(opts.axis&&!opts.candle){ctx.strokeStyle=line;ctx.setLineDash([3*r,3*r]);ctx.beginPath();ctx.moveTo(padL,Y(v[0]));ctx.lineTo(W-padR,Y(v[0]));ctx.stroke();ctx.setLineDash([])}
    if(prog>=1){const lx=X(n-1),ly=Y(v[n-1]),pu=(Math.sin(now/400)+1)/2;ctx.fillStyle=col;ctx.globalAlpha=.25*pu;ctx.beginPath();ctx.arc(lx,ly,(5+6*pu)*r,0,6.283);ctx.fill();ctx.globalAlpha=1;ctx.beginPath();ctx.arc(lx,ly,3.5*r,0,6.283);ctx.fill()}
    if(C.hover>=0&&C.hover<n){const x=X(C.hover),y=Y(v[C.hover]);ctx.strokeStyle=ink;ctx.globalAlpha=.5;ctx.lineWidth=r;ctx.beginPath();ctx.moveTo(x,padT);ctx.lineTo(x,H-padB);ctx.stroke();ctx.globalAlpha=1;ctx.fillStyle=cs.getPropertyValue('--p1').trim();ctx.strokeStyle=col;ctx.lineWidth=2*r;ctx.beginPath();ctx.arc(x,y,5*r,0,6.283);ctx.fill();ctx.stroke()}
    C.geo={X,padL,padR,W,n,r}};
  C.lows=()=>C.ohlc?C.ohlc.map(c=>c.l):[];C.highs=()=>C.ohlc?C.ohlc.map(c=>c.h):[];
  C.idx=e=>{const g=C.geo;if(!g)return-1;const rr=cv.getBoundingClientRect(),x=(e.clientX-rr.left)*g.r;return Math.max(0,Math.min(g.n-1,Math.round((x-g.padL)/(g.W-g.padL-g.padR)*(g.n-1))))};
  C.size();return C}

/* ---------- index ---------- */
let IC=null,HC=null;const UI2={range:90,ctype:'line'};
function idxData(n){const s=lifeSeries(n+1);const raw=[...Array(n+1)].map((_,i)=>dayScore(addDays(today(),i-n)));return{vals:s.slice(1),ohlc:s.slice(1).map((c,i)=>{const o=s[i],r=raw[i+1];return{o,c,h:Math.max(o,c,(c+r)/2),l:Math.min(o,c,(c+r)/2*.9+Math.min(o,c)*.1)}})}}
function renderIndex(keep){const n=UI2.range,{vals,ohlc}=idxData(n);IC.opts.candle=UI2.ctype==='candle';IC.ohlc=ohlc;IC.set(vals,null,keep);
  const all=lifeSeries(181);const last=all[all.length-1],d1=chgOf(all,1),dn=(vals[vals.length-1]-vals[0])*100;
  setPrice(last);$('#chg').innerHTML=`<span class="${cls(d1/100)}">${d1>=0?'▲':'▼'} ${sgn(d1)} <span class="pill">${sgn(d1/(Math.max(.01,all[all.length-2]))) }%</span></span><span class="mono" style="color:var(--mute)">today</span><span class="${cls(dn/100)}">${sgn(dn)} ${({7:'1W',30:'1M',90:'3M',180:'6M'})[n]}</span>`;
  const hi=Math.max(...all)*100,lo=Math.min(...all)*100;let rt=0,rd=0,T=today();for(const d of state.domains)for(const h of d.habits){rt++;if(h.days[T])rd++}
  const best=state.domains.slice().sort((a,b)=>momentum(b)-momentum(a))[0];
  $('#kpis').innerHTML=`<div class="kpi"><b>${lo.toFixed(1)}–${hi.toFixed(1)}</b><span>6M range</span></div><div class="kpi"><b>${rd}/${rt}</b><span>Orders filled</span></div><div class="kpi"><b>${state.domains.length}</b><span>Holdings</span></div><div class="kpi"><b class="${best&&cls(momentum(best))}">${best?ticker(best):'—'}</b><span>Top mover</span></div>`;
  $$('#rng button').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.v===n)));$$('#ctype button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===UI2.ctype)));requestAnimationFrame(()=>{inkTo('#rng');inkTo('#ctype')})}
function inkTo(sel){const s=$(sel),a=s&&s.querySelector('[aria-pressed="true"]'),k=s&&s.querySelector('.ink');if(a&&k){k.style.left=a.offsetLeft+'px';k.style.width=a.offsetWidth+'px'}}
let lastPrice=null;
function setPrice(v){const s=(v*100).toFixed(2),el=$('#price');if(!el.querySelector('.odo')||el.dataset.len!==String(s.length)){el.dataset.len=s.length;el.innerHTML='<span class="odo">'+[...s].map(ch=>ch==='.'?'<span class="sep">.</span>':'<span class="dg">'+[...'0123456789'].map(x=>`<span>${x}</span>`).join('')+'</span>').join('')+'</span>'}
  const dgs=el.querySelectorAll('.dg');let k=0;[...s].forEach(ch=>{if(ch==='.')return;dgs[k++].style.transform=`translateY(-${(+ch)*10}%)`});
  if(lastPrice!=null&&Math.abs(v-lastPrice)>1e-6){el.classList.remove('flash-up','flash-down');void el.offsetWidth;el.classList.add(v>lastPrice?'flash-up':'flash-down')}lastPrice=v}
{const box=$('#ichart'),xh=$('#xh');const mv=e=>{if(!IC)return;const i=IC.idx(e);IC.hover=i;const n=IC.vals.length,d2=parseKey(addDays(today(),i-(n-1)));const g=IC.geo;xh.textContent=`${d2.getDate()} ${MON[d2.getMonth()]} · ${P(IC.vals[i])}`;xh.style.left=Math.min(Math.max(g.X(i)/g.r,60),box.clientWidth-60)+'px';xh.classList.add('on')};
 box.addEventListener('pointermove',mv);box.addEventListener('pointerdown',mv);const off=()=>{if(IC)IC.hover=-1;xh.classList.remove('on')};box.addEventListener('pointerleave',off);box.addEventListener('pointerup',e=>{if(e.pointerType!=='mouse')setTimeout(off,1600)})}

/* ---------- heatmap (squarified treemap) ---------- */
function squarify(items,x,y,w,h){const out=[];let rest=items.slice();const total=rest.reduce((s,i)=>s+i.v,0)||1;rest.forEach(i=>i.a=i.v/total*w*h);
  const worst=(row,len)=>{const s=row.reduce((a,b)=>a+b.a,0),mx=Math.max(...row.map(r=>r.a)),mn=Math.min(...row.map(r=>r.a));return Math.max(len*len*mx/(s*s),s*s/(len*len*mn))};
  while(rest.length){const len=Math.min(w,h);let row=[rest[0]],i=1;while(i<rest.length&&worst([...row,rest[i]],len)<=worst(row,len)){row.push(rest[i]);i++}
    const s=row.reduce((a,b)=>a+b.a,0);if(w>=h){const cw=s/h;let cy=y;for(const r of row){const ch=r.a/cw;out.push({...r,x,y:cy,w:cw,h:ch});cy+=ch}x+=cw;w-=cw}else{const rh=s/w;let cx=x;for(const r of row){const cw=r.a/rh;out.push({...r,x:cx,y,w:cw,h:rh});cx+=cw}y+=rh;h-=rh}rest=rest.slice(row.length)}return out}
function heatColor(c){const t=Math.max(-1,Math.min(1,c/10));const neutral=[58,61,68],g=[24,166,90],rd=[179,54,59];const to=t>=0?g:rd,k=Math.abs(t);return`rgb(${neutral.map((v,i)=>Math.round(v+(to[i]-v)*k)).join(',')})`}
function renderHeat(){const box=$('#heat'),W=box.clientWidth,H=box.clientHeight;if(!W)return;const items=state.domains.map(d=>({d,v:Math.max(.08,(d.muted?.2:d.weight??.75)*(.4+prog(d))),c:momentum(d)*100})).sort((a,b)=>b.v-a.v);
  box.innerHTML=squarify(items,0,0,W,H).map((t,i)=>{const big=t.w>140&&t.h>90;return`<button class="tile ${big?'big':''}" style="left:${t.x}px;top:${t.y}px;width:${t.w}px;height:${t.h}px;background:${heatColor(t.c)};--i:${i}" data-action="open" data-d="${t.d.id}" aria-label="${esc(t.d.name)}"><div><b>${ticker(t.d)}</b>${t.h>60&&t.w>70?`<br><small>${esc(t.d.name)}</small>`:''}</div>${t.h>44?`<em>${t.c>=0?'+':'−'}${Math.abs(t.c).toFixed(1)}</em>`:''}</button>`}).join('')}

/* ---------- lists ---------- */
function renderTape(){const items=state.domains.map(d=>{const s=series(d,8),c=chgOf(s,1);return`<span><b>${ticker(d)}</b>${P(prog(d))}<span class="${cls(c/100)}">${c>=0?'▲':'▼'}${Math.abs(c).toFixed(2)}</span></span>`}).join('');const all=lifeSeries(3),c=chgOf(all,1);const lead=`<span><b>LIFX</b>${P(all[all.length-1])}<span class="${cls(c/100)}">${c>=0?'▲':'▼'}${Math.abs(c).toFixed(2)}</span></span>`;$('#tape').innerHTML=(lead+items).repeat(2)}
function renderOrders(){const T=today();let rt=0,rd=0;const rows=[];for(const d of state.domains)for(const h of d.habits){rt++;if(h.days[T])rd++;rows.push({d,h})}
  $('#ofill').textContent=`${rd}/${rt} filled`;$('#fillbar').style.setProperty('--w',(rt?rd/rt*100:0)+'%');
  $('#orders').innerHTML=rows.map(({d,h},i)=>{const s=streak(h),on=!!h.days[T];return`<div class="ord" style="--c:${esc(d.color)}"><span class="tk">${ticker(d)}</span><span class="on"><b>${esc(h.name)}</b><span>${habitWeek(h)}/7 this week${s?` · ${s}d streak`:''}</span></span><button class="exec" data-action="tick" data-d="${d.id}" data-h="${h.id}" aria-pressed="${on}"><span class="l1">EXECUTE</span><span class="l2">FILLED ✓</span></button></div>`}).join('')||`<div class="empty"><b>No orders yet</b>Open a holding and add a ritual: something you do on a day.</div>`}
function renderWL(){$('#wl').innerHTML=state.domains.map((d,i)=>{const s=series(d,30),c=momentum(d)*100;const col=c>=0?'var(--up)':'var(--down)';return`<button class="wr" style="--c:${esc(d.color)};--i:${i}" data-action="open" data-d="${d.id}"><span class="wn"><span class="tk">${ticker(d)}</span><span>${esc(d.name)}</span></span>${sparkSvg(s,col)}<span class="wp ${cls(c/100)}"><b style="color:var(--ink)">${P(prog(d))}</b><span>${c>=0?'+':'−'}${Math.abs(c).toFixed(2)}</span></span></button>`}).join('')}
function renderEarn(){const T=today();const ev=[];state.domains.forEach(d=>d.milestones.forEach(m=>{if(!m.done&&m.due)ev.push({d,m,k:dayDiff(T,m.due)})}));ev.sort((a,b)=>a.k-b.k);
  $('#earn').innerHTML=ev.slice(0,6).map(({d,m,k})=>{const dt=parseKey(m.due);return`<div class="er" style="--c:${esc(d.color)}"><div class="cal"><small>${MON[dt.getMonth()].toUpperCase()}</small><b>${dt.getDate()}</b></div><div style="min-width:0"><p>${esc(m.text)}</p><em>${ticker(d)} · ${k<0?`${-k}d overdue`:k===0?'today':`in ${k}d`}</em></div><button class="btn ghost" style="height:32px;padding:0 10px;font-size:12px" data-action="open-goals" data-d="${d.id}">View</button></div>`}).join('')||`<div class="empty"><b>Nothing scheduled</b>Give your goals a due date and they show up here.</div>`}
function renderHeaderBits(){const n=new Date(),doy=Math.round((new Date(n.getFullYear(),n.getMonth(),n.getDate())-new Date(n.getFullYear(),0,1))/864e5)+1;$('#appName').textContent=state.profile.name||'Equity';$('#mkt').textContent=`Market open · ${DOW[n.getDay()].slice(0,3)} ${n.getDate()} ${MON[n.getMonth()]} · D${doy}`;
  $('#banner').innerHTML=DEMO?`<div class="banner"><p><b>Demo portfolio.</b> Try anything. Nothing is saved.</p><button class="btn ghost" data-action="exit-demo">Open my portfolio</button></div>`:state.example?`<div class="banner"><p><b>Sample portfolio.</b> Execute an order, open a holding, scrub the chart.</p><button class="btn" data-action="start-fresh">Start mine</button><button class="btn ghost" data-action="keep-example">Keep exploring</button></div>`:''}
function renderAll(){renderHeaderBits();renderTape();if(IC)renderIndex(true);renderHeat();renderOrders();renderWL();renderEarn();renderPhoto();if(SH.kind==='area')renderArea();if(SH.kind==='settings')renderSettings()}
function renderMain(){renderAll()}function renderHero(){renderIndex(true);renderTape();renderWL();renderHeat()}function setFocus(id){if(id)openSheet('area',id)}

/* ---------- execute an order ---------- */
function tick(btn){const d=D_(btn.dataset.d),h=d?.habits.find(x=>x.id===btn.dataset.h);if(!h)return;const k=today(),was=!!h.days[k];if(was)delete h.days[k];else h.days[k]=1;
  btn.setAttribute('aria-pressed',String(!was));haptic(was?6:[8,24,12]);
  if(!was&&!RM.matches){const st=document.createElement('span');st.className='stamp';st.textContent='FILLED';btn.parentElement.appendChild(st);setTimeout(()=>st.remove(),1500)}
  const before=lifeIndex();commit({render:false});const after=lifeIndex();
  setTimeout(()=>{renderIndex(true);renderTape();renderWL();renderHeat();renderEarn();const T=today();let rt=0,rd=0;for(const dd of state.domains)for(const hh of dd.habits){rt++;if(hh.days[T])rd++}$('#ofill').textContent=`${rd}/${rt} filled`;$('#fillbar').style.setProperty('--w',(rt?rd/rt*100:0)+'%');
    const sp=btn.parentElement.querySelector('.on span');if(sp){const s=streak(h);sp.textContent=`${habitWeek(h)}/7 this week${s?` · ${s}d streak`:''}`}
    if(!was)toast(`${ticker(d)} order filled · LIFX ${(after-before)*100>=0?'+':'−'}${Math.abs((after-before)*100).toFixed(2)}`);if(SH.kind==='area')renderArea()},60)}

/* ---------- loop & boot ---------- */
let last=performance.now();
function frame(now){const dt=Math.min(50,now-last);last=now;if(!document.hidden){if(IC)IC.draw(now,dt);if(HC&&HC.cv.isConnected)HC.draw(now,dt)}requestAnimationFrame(frame)}
function drawHolding(d){const cv=$('#hc');if(!cv)return;HC=makeChart(cv.parentElement,cv,{axis:true});const s=series(d,90);HC.set(s);
  const box=cv.parentElement;const mv=e=>{HC.hover=HC.idx(e)};box.onpointermove=mv;box.onpointerdown=mv;box.onpointerleave=()=>HC.hover=-1}
if(DEMO)demoPhotos();
applyTheme();IC=makeChart($('#ichart'),$('#ic'),{axis:true});renderAll();renderIndex(false);
addEventListener('resize',()=>{IC.size();if(HC&&HC.cv.isConnected)HC.size();renderHeat();inkTo('#rng');inkTo('#ctype')});
document.fonts?.ready.then(()=>{inkTo('#rng');inkTo('#ctype')});
requestAnimationFrame(t=>{last=t;frame(t)});
setInterval(()=>{const k=today();if(k!==app._day){app._day=k;renderAll()}else renderHeaderBits()},60000);app._day=today();
setTimeout(connect,0);
})();
