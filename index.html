<style>
/* Layout concept: a native-feeling finance app for your life. Areas are holdings, rituals are orders you swipe to fill,
   the Life Index is the market. Four tabs on a floating glass dock; one lime accent on deep black; big confident numbers. */
:root{
  --bg:#060607; --p1:#101113; --p2:#18191C; --p3:#202226; --line:rgba(255,255,255,.06); --line2:rgba(255,255,255,.11);
  --ink:#F5F5F7; --mute:#8D8E96; --faint:#55575E; --acc:#C8FF4D; --acc-ink:#0A0B05; --up:#C8FF4D; --down:#FF5C7A;
  --sans:"Geist","SF Pro Display","Helvetica Neue","Segoe UI",system-ui,sans-serif; --mono:"Geist Mono",ui-monospace,Menlo,Consolas,monospace;
  --ease:cubic-bezier(.22,1,.36,1); --spring:cubic-bezier(.34,1.4,.5,1);
  --gx:max(18px,env(safe-area-inset-left,0px)); --gxr:max(18px,env(safe-area-inset-right,0px));
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#F1F1EE;--p1:#FFFFFF;--p2:#F4F4F1;--p3:#EAEAE6;--line:rgba(0,0,0,.06);--line2:rgba(0,0,0,.11);--ink:#0B0B0C;--mute:#6A6B72;--faint:#A7A8AD;--acc:#0B0B0C;--acc-ink:#FFFFFF;--up:#16A34A;--down:#E11D48;color-scheme:light}}
:root[data-theme="light"]{--bg:#F1F1EE;--p1:#FFFFFF;--p2:#F4F4F1;--p3:#EAEAE6;--line:rgba(0,0,0,.06);--line2:rgba(0,0,0,.11);--ink:#0B0B0C;--mute:#6A6B72;--faint:#A7A8AD;--acc:#0B0B0C;--acc-ink:#FFFFFF;--up:#16A34A;--down:#E11D48;color-scheme:light}
.app[data-mode="night"]{--bg:#060607;--p1:#101113;--p2:#18191C;--p3:#202226;--line:rgba(255,255,255,.06);--line2:rgba(255,255,255,.11);--ink:#F5F5F7;--mute:#8D8E96;--faint:#55575E;--acc:#C8FF4D;--acc-ink:#0A0B05;--up:#C8FF4D;--down:#FF5C7A;color-scheme:dark}
.app[data-mode="day"]{--bg:#F1F1EE;--p1:#FFFFFF;--p2:#F4F4F1;--p3:#EAEAE6;--line:rgba(0,0,0,.06);--line2:rgba(0,0,0,.11);--ink:#0B0B0C;--mute:#6A6B72;--faint:#A7A8AD;--acc:#0B0B0C;--acc-ink:#FFFFFF;--up:#16A34A;--down:#E11D48;color-scheme:light}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;touch-action:manipulation}
:focus-visible{outline:2px solid var(--up);outline-offset:3px;border-radius:10px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eb{font-size:12px;color:var(--mute);font-weight:500;letter-spacing:.01em}
.up{color:var(--up)}.down{color:var(--down)}
.app{position:fixed;inset:0;background:var(--bg);overflow:hidden}
.glow{position:absolute;pointer-events:none;width:120vmax;height:70vmax;left:50%;top:-38vmax;transform:translateX(-50%);background:radial-gradient(closest-side,color-mix(in srgb,var(--up) 13%,transparent),transparent);transition:background 1s;animation:gl 12s ease-in-out infinite alternate}
.app[data-trend="down"] .glow{background:radial-gradient(closest-side,color-mix(in srgb,var(--down) 12%,transparent),transparent)}
@keyframes gl{to{transform:translateX(-46%) scale(1.08)}}
.panes{position:absolute;inset:0;overflow:hidden;transform-origin:50% 0;transition:transform .6s cubic-bezier(.2,1.05,.3,1),filter .6s,border-radius .6s}
.pane{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;visibility:hidden;pointer-events:none;contain:strict}
.pane.on{visibility:visible;pointer-events:auto}
.pane.out{pointer-events:none}
.wrap{max-width:720px;margin:0 auto;padding:calc(62px + env(safe-area-inset-top,0px)) var(--gxr) calc(130px + env(safe-area-inset-bottom,0px)) var(--gx)}

/* header */
.top{position:absolute;top:0;left:0;right:0;z-index:25;display:flex;align-items:center;gap:12px;padding:calc(12px + env(safe-area-inset-top,0px)) max(var(--gxr),calc((100% - 720px)/2 + var(--gxr))) 12px max(var(--gx),calc((100% - 720px)/2 + var(--gx)));transition:background .3s,backdrop-filter .3s,border-color .3s;border-bottom:1px solid transparent}
.app.scrolled .top{background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);border-color:var(--line)}
.logo{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--acc);color:var(--acc-ink);flex:none;box-shadow:0 8px 24px -8px color-mix(in srgb,var(--up) 70%,transparent)}
.logo svg{width:19px;height:19px}
.logo path{stroke-dasharray:40;stroke-dashoffset:40;animation:draw 1.2s var(--ease) .3s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.hd{flex:1;min-width:0}
.hd b{display:block;font-size:17px;font-weight:650;letter-spacing:-.02em;line-height:1.15}
.hd span{font-size:12.5px;color:var(--mute)}
.sync{width:7px;height:7px;border-radius:50%;background:var(--faint);flex:none;transition:background .3s}
.sync[data-s="ok"]{background:var(--up)}.sync[data-s="saving"]{background:#F5B83D}.sync[data-s="demo"]{background:#8B9DFF}
.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--p2);border:1px solid var(--line2);transition:transform .3s var(--spring)}
.avatar:active{transform:scale(.9)}
.avatar svg{width:18px;height:18px}

/* views */
.vt{font-size:clamp(30px,8vw,40px);font-weight:700;letter-spacing:-.04em;margin:14px 0 4px;line-height:1.05}
.vs{font-size:14.5px;color:var(--mute);margin:0 0 18px}
.ent .st-in>*{animation:rise .6s var(--ease) both}
.ent .st-in>*:nth-child(1){animation-delay:.03s}.ent .st-in>*:nth-child(2){animation-delay:.07s}.ent .st-in>*:nth-child(3){animation-delay:.11s}.ent .st-in>*:nth-child(4){animation-delay:.15s}.ent .st-in>*:nth-child(5){animation-delay:.19s}.ent .st-in>*:nth-child(n+6){animation-delay:.23s}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.98)}}
.card{background:var(--p1);border:1px solid var(--line);border-radius:24px;padding:18px;position:relative;overflow:hidden}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:28px 0 12px}
.sec-h h3{margin:0;font-size:20px;font-weight:650;letter-spacing:-.025em}
.link{font-size:13.5px;font-weight:550;color:var(--mute);display:inline-flex;align-items:center;gap:4px}
.link svg{width:14px;height:14px}

/* hero */
.hero{margin-top:4px}
.hero .lab{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--mute);font-weight:500}
.hero .lab i{width:6px;height:6px;border-radius:50%;background:var(--up);animation:live 2s infinite}
@keyframes live{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--up) 60%,transparent)}70%,100%{box-shadow:0 0 0 7px transparent}}
.price{font-family:var(--sans);font-weight:650;font-size:clamp(58px,17vw,92px);line-height:1;letter-spacing:-.055em;display:flex;align-items:flex-end;margin:8px 0 10px;font-variant-numeric:tabular-nums}
.odo{display:inline-flex;align-items:flex-start;overflow:hidden;height:1.02em;line-height:1}
.odo .dg{flex:none;height:10.2em;display:inline-flex;flex-direction:column;transition:transform 1.1s var(--ease)}
.odo .dg span{height:1.02em;line-height:1;flex:none}
.odo .sep{opacity:.5}
.price.pup{animation:pf 1s ease}@keyframes pf{25%{color:var(--up)}}
.price.pdn{animation:pfd 1s ease}@keyframes pfd{25%{color:var(--down)}}
.chg{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 11px;border-radius:99px;font-size:13.5px;font-weight:600;font-variant-numeric:tabular-nums;background:color-mix(in srgb,currentColor 13%,transparent)}
.chip svg{width:12px;height:12px}
.chg .muted{font-size:13.5px;color:var(--mute)}
.chartw{position:relative;margin:18px calc(-1*var(--gxr)) 0 calc(-1*var(--gx));height:clamp(200px,52vw,280px);touch-action:pan-y}
.chartw canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.tip{position:absolute;top:-4px;transform:translateX(-50%);pointer-events:none;padding:7px 11px;border-radius:12px;background:var(--ink);color:var(--bg);font-size:12.5px;font-weight:600;white-space:nowrap;opacity:0;transition:opacity .15s;font-variant-numeric:tabular-nums}
.tip.on{opacity:1}
.tip small{display:block;font-weight:500;opacity:.65;font-size:11px}
.rrow{display:flex;gap:8px;margin-top:14px;align-items:stretch}
.ctb{width:44px;flex:none;border-radius:99px;background:var(--p1);border:1px solid var(--line);display:grid;place-items:center;color:var(--mute);transition:all .35s var(--spring)}
.ctb svg{width:19px;height:19px}.ctb[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}.ctb:active{transform:scale(.88)}
.pills{flex:1;position:relative;display:flex;gap:2px;padding:4px;border-radius:99px;background:var(--p1);border:1px solid var(--line);isolation:isolate}
.pills .ink{position:absolute;top:4px;bottom:4px;left:0;width:0;border-radius:99px;background:var(--p3);z-index:-1;transition:left .5s var(--spring),width .5s var(--spring)}
.pills button{flex:1;height:34px;border-radius:99px;font-size:13px;font-weight:600;color:var(--mute);transition:color .3s}
.pills button[aria-pressed="true"]{color:var(--ink)}

/* bento */
.bento{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:22px}
.bento .card{text-align:left;min-height:150px;display:flex;flex-direction:column;transition:transform .4s var(--spring)}
.bento .card:active{transform:scale(.97)}
.bento .wide{grid-column:1/-1;min-height:0}
.k{font-size:12.5px;color:var(--mute);font-weight:500;display:flex;align-items:center;gap:6px}
.k svg{width:14px;height:14px}
.big{font-size:34px;font-weight:650;letter-spacing:-.04em;margin-top:auto;line-height:1;font-variant-numeric:tabular-nums}
.big small{font-size:15px;color:var(--mute);font-weight:500;letter-spacing:-.01em;margin-left:2px}
.sub{font-size:12.5px;color:var(--mute);margin-top:6px;overflow-wrap:anywhere}
.ringc{display:flex;align-items:center;gap:14px;margin-top:auto}
.ring{width:66px;height:66px;flex:none;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:8;stroke-linecap:round}
.ring .t{stroke:var(--p3)}
.ring .v{stroke:var(--up);transition:stroke-dashoffset 1.2s var(--ease);filter:drop-shadow(0 0 6px color-mix(in srgb,var(--up) 60%,transparent))}
.move{display:flex;align-items:center;gap:14px}
.move .ml{flex:1;min-width:0}
.move b{display:block;font-size:19px;font-weight:650;letter-spacing:-.02em;margin:4px 0 4px;overflow-wrap:anywhere}
.move .gain{font-size:13px;font-weight:600}
.tkr{display:inline-flex;align-items:center;justify-content:center;height:22px;padding:0 7px;border-radius:7px;font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.03em;color:var(--c);background:color-mix(in srgb,var(--c) 16%,transparent)}
.cta{position:relative;overflow:hidden;height:46px;padding:0 20px;border-radius:99px;background:var(--acc);color:var(--acc-ink);font-weight:650;font-size:14.5px;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;flex:none;transition:transform .3s var(--spring),box-shadow .3s;box-shadow:0 10px 28px -12px color-mix(in srgb,var(--up) 80%,transparent)}
.cta:active{transform:scale(.94)}
.cta svg{width:16px;height:16px}
.cta.done{background:var(--p3);color:var(--mute);box-shadow:none}

/* holdings carousel */
.carousel{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:0 calc(-1*var(--gxr)) 0 calc(-1*var(--gx));padding:2px var(--gxr) 6px var(--gx);scroll-padding-left:var(--gx)}
.carousel::-webkit-scrollbar{display:none}
.hc{flex:0 0 156px;scroll-snap-align:start;height:176px;border-radius:24px;padding:16px;display:flex;flex-direction:column;text-align:left;color:#fff;position:relative;overflow:hidden;background:linear-gradient(155deg,color-mix(in srgb,var(--c) 92%,#fff 8%),color-mix(in srgb,var(--c) 55%,#000));box-shadow:0 14px 30px -18px var(--c);transition:transform .4s var(--spring)}
.hc:active{transform:scale(.95)}
.hc::after{content:"";position:absolute;width:140px;height:140px;right:-50px;top:-60px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.35),transparent 65%)}
.hc .t{font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.04em;opacity:.9}
.hc .n{font-size:14px;font-weight:600;margin-top:2px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hc svg{width:100%;height:36px;margin-top:auto;overflow:visible}
.hc .p{display:flex;align-items:baseline;justify-content:space-between;margin-top:8px}
.hc .p b{font-size:22px;font-weight:650;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.hc .p>span{font-size:12px;font-weight:600;padding:3px 7px;border-radius:99px;background:rgba(0,0,0,.22)}
.hc.add{background:var(--p1);color:var(--mute);border:1.5px dashed var(--line2);box-shadow:none;align-items:center;justify-content:center;gap:8px;font-weight:600}
.hc.add::after{display:none}
.hc.add i{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--p2);font-style:normal;font-size:24px;font-weight:300;color:var(--ink)}

/* map */
.map{position:relative;height:clamp(220px,62vw,300px)}
.tile{position:absolute;padding:10px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;overflow:hidden;border-radius:14px;color:#fff;transition:transform .4s var(--spring),filter .2s;animation:tIn .7s var(--spring) both;animation-delay:calc(var(--i)*60ms + .15s)}
.tile:active{transform:scale(.96)}
@keyframes tIn{from{opacity:0;transform:scale(.6)}}
.tile b{font-family:var(--mono);font-size:12.5px;font-weight:600}
.tile small{display:block;font-size:11.5px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile em{font-style:normal;font-size:14px;font-weight:650;font-variant-numeric:tabular-nums}
.tile.lg em{font-size:20px}.tile.lg b{font-size:14px}

/* orders */
.prog{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.prog .bar{flex:1;height:10px;border-radius:99px;background:var(--p2);overflow:hidden}
.prog .bar i{display:block;height:100%;width:var(--w);border-radius:99px;background:var(--up);transition:width 1s var(--ease);box-shadow:0 0 16px color-mix(in srgb,var(--up) 50%,transparent);position:relative;overflow:hidden}
.prog .bar i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);animation:shine 2.4s linear infinite}
@keyframes shine{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.prog b{font-size:15px;font-weight:650;font-variant-numeric:tabular-nums}
.og{margin-top:22px}
.og-h{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--mute);margin:0 0 8px 4px}
.og-h i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.ord{position:relative;border-radius:20px;overflow:hidden;margin-bottom:8px;touch-action:pan-y;background:var(--up)}
.ord .bgtxt{position:absolute;inset:0;display:flex;align-items:center;padding-left:22px;font-weight:700;font-size:14px;color:var(--acc-ink);gap:8px}
.ord .bgtxt svg{width:18px;height:18px}
.oin{position:relative;display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--p1);border:1px solid var(--line);border-radius:20px;transition:transform .45s var(--spring),background .4s,border-color .4s;will-change:transform}
.ord.dragging .oin{transition:none}
.ckb{width:30px;height:30px;border-radius:50%;flex:none;border:2px solid var(--line2);display:grid;place-items:center;transition:background .35s,border-color .35s,transform .45s var(--spring)}
.ckb svg{width:15px;height:15px;stroke:var(--acc-ink);stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .4s var(--ease) .05s}
.ord[data-on="1"] .oin{background:color-mix(in srgb,var(--up) 10%,var(--p1));border-color:color-mix(in srgb,var(--up) 35%,transparent)}
.ord[data-on="1"] .ckb{background:var(--up);border-color:var(--up);transform:scale(1.08)}
.ord[data-on="1"] .ckb svg{stroke-dashoffset:0}
.ot{flex:1;min-width:0}
.ot b{display:block;font-size:15.5px;font-weight:600;letter-spacing:-.01em;overflow-wrap:anywhere}
.ot span{font-size:12.5px;color:var(--mute)}
.ord[data-on="1"] .ot b{color:var(--ink)}
.str{display:inline-flex;align-items:center;gap:3px;font-size:12.5px;font-weight:600;color:var(--mute);font-variant-numeric:tabular-nums}
.str.hot{color:#FFB347}
.str svg{width:13px;height:13px}
.hint{display:flex;align-items:center;justify-content:center;gap:8px;font-size:12.5px;color:var(--faint);margin:16px 0 0}
.hint svg{width:16px;height:16px;animation:nudge 1.8s ease-in-out infinite}
@keyframes nudge{50%{transform:translateX(5px)}}
.pt{position:fixed;z-index:85;border-radius:50%;background:var(--up);pointer-events:none}

/* holdings list */
.hl{display:flex;flex-direction:column;gap:8px}
.hr{display:grid;grid-template-columns:44px minmax(0,1fr) 64px auto;gap:12px;align-items:center;padding:12px 14px;border-radius:20px;background:var(--p1);border:1px solid var(--line);text-align:left;width:100%;transition:transform .35s var(--spring)}
.hr:active{transform:scale(.98)}
.av{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-family:var(--mono);font-size:11px;font-weight:600;color:#fff;background:linear-gradient(145deg,var(--c),color-mix(in srgb,var(--c) 55%,#000))}
.hr .nm b{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hr .nm span{font-size:12.5px;color:var(--mute)}
.hr svg{width:64px;height:28px;overflow:visible}
.hr .pr{text-align:right}
.hr .pr b{display:block;font-size:15.5px;font-weight:650;font-variant-numeric:tabular-nums}
.hr .pr>span{display:inline-block;margin-top:3px;font-size:11.5px;font-weight:600;padding:2px 7px;border-radius:99px;background:color-mix(in srgb,currentColor 13%,transparent)}
.addh{width:100%;height:54px;border-radius:20px;border:1.5px dashed var(--line2);color:var(--mute);font-weight:600;font-size:14.5px;margin-top:4px}

/* desk */
.rate{border-radius:28px;padding:22px;position:relative;overflow:hidden;background:radial-gradient(120% 120% at 0% 0%,color-mix(in srgb,var(--rc) 30%,var(--p1)),var(--p1) 60%);border:1px solid color-mix(in srgb,var(--rc) 30%,var(--line))}
.rate .rw{font-size:clamp(34px,10vw,48px);font-weight:750;letter-spacing:-.045em;line-height:1;margin:10px 0 12px;color:var(--rc)}
.rate p{margin:0;font-size:15.5px;line-height:1.55;color:var(--mute);text-wrap:pretty}
.rate p b{color:var(--ink);font-weight:600}
.rate p b.up{color:var(--up)}.rate p b.down{color:var(--down)}
.moves{display:flex;flex-direction:column;gap:8px}
.mv{display:flex;align-items:center;gap:12px;padding:12px 12px 12px 14px;border-radius:20px;background:var(--p1);border:1px solid var(--line)}
.mv .rk{width:26px;font-family:var(--mono);font-size:12px;color:var(--faint);flex:none}
.mv .ml{flex:1;min-width:0}
.mv .ml b{display:block;font-size:15px;font-weight:600;overflow-wrap:anywhere}
.mv .ml span{font-size:12.5px}
.mv .go{height:38px;padding:0 15px;border-radius:99px;background:var(--p3);font-weight:600;font-size:13.5px;transition:transform .3s var(--spring)}
.mv .go:active{transform:scale(.92)}
.mv:first-child .go{background:var(--acc);color:var(--acc-ink)}
.proj .pv{display:flex;align-items:baseline;gap:10px;margin-top:6px}
.proj .pv b{font-size:40px;font-weight:650;letter-spacing:-.045em;font-variant-numeric:tabular-nums}
.proj .pv span{font-size:14px;font-weight:600}
.pc{position:relative;height:120px;margin:12px -6px 8px}
.pc canvas{position:absolute;inset:0;width:100%;height:100%}
.sl{display:flex;align-items:center;gap:14px;margin-top:6px}
.sl span{font-size:13.5px;color:var(--mute);white-space:nowrap}
.sl b{font-size:14px;font-weight:650;min-width:44px;text-align:right;font-variant-numeric:tabular-nums}
input[type=range].rg{-webkit-appearance:none;appearance:none;flex:1;height:8px;border-radius:99px;background:linear-gradient(90deg,var(--up) var(--f,50%),var(--p3) var(--f,50%));outline-offset:6px}
input[type=range].rg::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:0 4px 14px rgba(0,0,0,.35),0 0 0 4px color-mix(in srgb,var(--up) 35%,transparent);cursor:pointer;transition:transform .2s}
input[type=range].rg:active::-webkit-slider-thumb{transform:scale(1.15)}
input[type=range].rg::-moz-range-thumb{width:24px;height:24px;border:0;border-radius:50%;background:#fff;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.proj p{margin:14px 0 0;font-size:14px;line-height:1.55;color:var(--mute)}
.proj p b{color:var(--ink);font-weight:600}

/* dock */
.dock{position:absolute;z-index:40;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;gap:2px;padding:6px;border-radius:99px;background:color-mix(in srgb,var(--p2) 72%,transparent);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border:1px solid var(--line2);box-shadow:0 20px 50px -18px rgba(0,0,0,.6);isolation:isolate;animation:dIn .8s var(--spring) .3s both}
@keyframes dIn{from{opacity:0;transform:translate(-50%,40px)}}
.dock .ink{position:absolute;top:6px;bottom:6px;left:0;width:0;border-radius:99px;background:var(--ink);z-index:-1;transition:left .5s var(--spring),width .5s var(--spring)}
.dock button{display:flex;align-items:center;gap:7px;height:48px;padding:0 16px;border-radius:99px;color:var(--mute);font-size:13.5px;font-weight:600;transition:color .35s}
.dock button svg{width:21px;height:21px;flex:none}
.dock button span{max-width:0;overflow:hidden;white-space:nowrap;transition:max-width .5s var(--spring),opacity .3s;opacity:0}
.dock button[aria-current="true"]{color:var(--bg)}
.dock button[aria-current="true"] span{max-width:90px;opacity:1}
.dock .badge{position:absolute;top:8px;margin-left:16px;min-width:16px;height:16px;padding:0 4px;border-radius:99px;background:var(--down);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center}

/* photo */
.ph{display:grid;grid-template-columns:112px minmax(0,1fr);gap:16px;align-items:start}
.ph-frame{position:relative;width:112px;aspect-ratio:4/5;border-radius:18px;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;max-width:100%}
.ph-frame img{width:100%;height:100%;object-fit:cover;display:block}
.ph-take{border:1.5px dashed var(--line2);background:var(--p2);cursor:pointer}
.ph-take b{font-size:12.5px;font-weight:600;line-height:1.2;padding:0 8px}
.ph-cam{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--acc);color:var(--acc-ink)}
.ph-cam svg{width:20px;height:20px}
.ph-frame.flash::after{content:"";position:absolute;inset:0;background:#fff;animation:flash .7s forwards}
@keyframes flash{from{opacity:.9}to{opacity:0}}
.ph-in{position:absolute;inset:0;opacity:0;width:100%;height:100%;font-size:0;cursor:pointer}
.ph-side{display:flex;flex-direction:column;gap:10px;min-width:0}
.ph-side p{margin:0;font-size:14px;line-height:1.5;color:var(--mute)}
.ph-strip{grid-column:1/-1;display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:4px}
.ph-th{position:relative;aspect-ratio:3/4;border-radius:6px;overflow:hidden;max-width:100%;background:var(--p2)}
.ph-th img{width:100%;height:100%;object-fit:cover;display:block}
.ph-th.emp{background:transparent;border:1px dashed var(--line2)}
.ph-th.td{border-color:var(--ink)}
.ph-load{background:linear-gradient(100deg,var(--p2) 30%,var(--p3) 50%,var(--p2) 70%);background-size:300% 100%;animation:shim 1.4s linear infinite}
@keyframes shim{to{background-position:-150% 0}}

/* sheets & shared */
.veil{position:absolute;inset:0;z-index:50;background:rgba(0,0,0,.5);opacity:0;transition:opacity .35s;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.veil.on{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:51;max-height:93%;display:flex;flex-direction:column;background:var(--p1);border-radius:30px 30px 0 0;border-top:1px solid var(--line2);transform:translateY(105%);transition:transform .6s cubic-bezier(.2,1.05,.3,1);padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -30px 60px -30px rgba(0,0,0,.6)}
.sheet.on{transform:none}.sheet.drag{transition:none}
.grab{padding:10px 0 6px;display:flex;justify-content:center;touch-action:none;cursor:grab;flex:none}
.grab i{width:42px;height:5px;border-radius:5px;background:var(--line2)}
.sbody{overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:0 var(--gxr) 28px var(--gx)}
.s-hd{display:flex;align-items:center;gap:14px;padding:6px 0 16px}
.s-orb{width:52px;height:52px;border-radius:16px;flex:none;background:linear-gradient(145deg,var(--c),color-mix(in srgb,var(--c) 55%,#000));box-shadow:0 10px 24px -10px var(--c)}
.s-hd h2{margin:0;font-size:26px;font-weight:700;letter-spacing:-.035em;outline:none;overflow-wrap:anywhere}
.s-hd p{margin:2px 0 0;font-size:13px;color:var(--mute);font-family:var(--mono)}
.xbtn{margin-left:auto;width:38px;height:38px;border-radius:50%;background:var(--p2);display:grid;place-items:center;flex:none;transition:transform .35s var(--spring)}
.xbtn:active{transform:scale(.85)}
.xbtn svg{width:14px;height:14px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.stats .st{padding:12px;border-radius:16px;background:var(--p2)}
.stats .st b{display:block;font-size:20px;font-weight:650;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.stats .st span{font-size:11.5px;color:var(--mute)}
.hchart{position:relative;height:170px;margin:14px -4px 0}
.hchart canvas{position:absolute;inset:0;width:100%;height:100%}
.tabs{position:sticky;top:0;z-index:3;display:flex;gap:2px;padding:4px;margin-top:14px;border-radius:99px;background:var(--p2);isolation:isolate}
.tabs .tk{position:absolute;top:4px;bottom:4px;left:0;width:0;border-radius:99px;background:var(--p1);box-shadow:0 2px 8px rgba(0,0,0,.2);z-index:-1;transition:left .5s var(--spring),width .5s var(--spring)}
.tabs button{position:relative;flex:1;height:36px;border-radius:99px;font-size:13px;font-weight:600;color:var(--mute);transition:color .3s}
.tabs button[aria-selected="true"]{color:var(--ink)}
.tabc{padding-top:14px}
.tabc>*{animation:rise .5s var(--ease) both;animation-delay:calc(var(--i,0)*40ms)}
.sbody .card{padding:16px;border-radius:20px;background:var(--p2);border:1px solid var(--line);margin-bottom:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.field{height:46px;border-radius:14px;border:1px solid var(--line2);background:var(--bg);padding:0 14px;font-size:16px;min-width:0;transition:border-color .2s,box-shadow .2s}
.field:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 4px color-mix(in srgb,var(--ink) 10%,transparent)}
textarea.field{height:auto;padding:12px 14px;resize:vertical}
.btn{position:relative;overflow:hidden;height:46px;padding:0 18px;border-radius:99px;background:var(--acc);color:var(--acc-ink);font-weight:650;font-size:14px;display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;transition:transform .3s var(--spring)}
.btn:active{transform:scale(.94)}
.btn.ghost{background:var(--p3);color:var(--ink)}
.btn.bad{background:color-mix(in srgb,var(--down) 14%,transparent);color:var(--down)}
.mt{display:flex;align-items:baseline;gap:8px;min-width:0}
.mt b{font-size:15.5px;outline:none;overflow-wrap:anywhere;min-width:0}
.pill{font-family:var(--mono);font-size:11px;padding:3px 8px;border-radius:99px;background:var(--p3);color:var(--mute);white-space:nowrap}
.mv2,.mvv{font-size:30px;font-weight:650;letter-spacing:-.035em;margin:6px 0 2px}
.sbody .mv{display:block;padding:0;border:0;background:none;font-size:30px;font-weight:650;letter-spacing:-.035em;margin:6px 0 2px;border-radius:0}
.sbody .mv small{font-size:13px;color:var(--mute);font-weight:500;margin-left:4px;letter-spacing:0}
.spark2{width:100%;height:44px;display:block;margin:6px 0 12px;overflow:visible}
.hist{list-style:none;margin:8px 0 0;padding:0;max-height:180px;overflow:auto}

<script>
(()=>{

/* ---------- state ---------- */
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function newDomain(name,glyph,color){return{id:uid(),name,glyph,color,note:'',weight:.75,muted:false,metrics:[],habits:[],milestones:[]}}
function makeExample(){
  const r=mulberry(23),T=today();
  const series=(n,base,amp,trend,{step=1,prob=1,dec=1}={})=>{const e=[];for(let i=n-1;i>=0;i-=step){if(r()>prob)continue;const v=base+trend*(n-1-i)+(r()-.5)*2*amp;const f=Math.pow(10,dec);e.push({id:uid(),d:addDays(T,-i),v:Math.round(v*f)/f})}return e};
  // rituals with phases so the landscape has real shape: momentum building, a lull, a comeback
  const H=(name,p,shape)=>{const days={};for(let i=0;i<185;i++){const k=addDays(T,-i);const s=shape?shape(i):1;if(r()<p*s)days[k]=1}return{id:uid(),name,days}};
  const M=(name,unit,target,dir,entries)=>({id:uid(),name,unit,target,dir,entries});
  const S=(text,done,due)=>({id:uid(),text,done,due:due||''});
  const D=(n,c,m,h,s,note)=>({...newDomain(n,'●',c),metrics:m,habits:h,milestones:s,note:note||''});
  const build=i=>clamp(1.3-i/70,.2,1.2), lull=i=>i>25&&i<45?.25:1.05, late=i=>i<30?1.2:.35, steady=()=>1;
  return{v:1,example:true,settings:{...DEFAULTS},profile:{name:'Equity',owner:''},domains:[
    D('Health','#3DDC97',[M('Sleep','h',8,'up',series(90,6.4,.7,.018)),M('Weight','kg',75,'down',series(90,83,.4,-.09,{step:2}))],[H('Workout',.6,build),H('No sugar',.55,build)],[S('Run a 10K under 55 min',false,addDays(T,44)),S('Annual blood panel',true)],'The ground everything else stands on.'),
    D('Mind','#6C8CFF',[M('Meditation','min',20,'up',series(90,9,5,.12,{prob:.8,dec:0}))],[H('Journal',.7,lull),H('No phone after 22:00',.5,lull)],[S('Finish 8-week course',false,addDays(T,20))],'Quiet is a skill.'),
    D('Craft','#FFB547',[M('Deep work','h',4,'up',series(90,2.2,1,.018,{prob:.75}))],[H('Plan tomorrow',.75,steady)],[S('Ship portfolio redesign',true),S('Ask for promotion review',false,addDays(T,30))],'Make things that outlast the week.'),
    D('Wealth','#FF7A45',[M('Savings rate','%',25,'up',series(90,14,3,.13,{step:7,dec:0}))],[H('Log expenses',.55,steady)],[S('Emergency fund: 3 months',false,addDays(T,90))]),
    D('Bonds','#FF5C8A',[M('Quality time','h',10,'up',series(90,5,2,.05,{step:7}))],[H('Call family',.4,late),H('Message a friend',.5,late)],[S('Weekend away with friends',false,addDays(T,25))],'People are the point.'),
    D('Wonder','#A779FF',[M('Words written','',500,'up',series(90,200,180,3,{prob:.55,dec:0}))],[H('Sketch 15 min',.4,lull)],[S('Finish the short story',false,addDays(T,40))]),
    D('Learning','#2EC5E6',[M('Pages read','',30,'up',series(90,14,10,.18,{prob:.8,dec:0}))],[H('Language practice',.6,build)],[S('Complete Spanish A2',false,addDays(T,60))])
  ]};
}
function makeBlank(keep){const base=[['Health','#3DDC97'],['Mind','#6C8CFF'],['Craft','#FFB547'],['Wealth','#FF7A45'],['Bonds','#FF5C8A'],['Wonder','#A779FF']];
  return{v:1,example:false,settings:{...DEFAULTS,...(keep?.settings||{})},profile:{name:'Equity',owner:'',...(keep?.profile||{})},domains:base.map(([n,c])=>newDomain(n,'●',c))}}
function migrate(s){
  if(!s||!Array.isArray(s.domains))return null;
  const st={...DEFAULTS};for(const k in DEFAULTS)if(s.settings&&s.settings[k]!==undefined&&typeof s.settings[k]===typeof DEFAULTS[k])st[k]=s.settings[k];
  if(!['auto','night','day'].includes(st.mode))st.mode='auto';s.example=!!s.example;
  s.settings=st;s.profile={name:'Equity',owner:'',...(s.profile||{})};if(['Life Orrery','Mixdown','Strata','Aura'].includes(s.profile.name))s.profile.name='Equity';
  s.photos=s.photos&&typeof s.photos==='object'?s.photos:{};
  s.domains=s.domains.filter(Boolean).map(d=>({...newDomain('Area','●','#6C8CFF'),...d,weight:typeof d.weight==='number'?clamp(d.weight):.75,muted:!!d.muted,
    metrics:(d.metrics||[]).map(m=>({id:uid(),name:'Signal',unit:'',target:0,dir:'up',...m,entries:(m.entries||[]).filter(e=>e&&e.d&&!isNaN(e.v)).map(e=>({id:e.id||uid(),d:e.d,v:+e.v})).sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:0)})),
    habits:(d.habits||[]).map(h=>({id:uid(),name:'Ritual',days:{},...h})),
    milestones:(d.milestones||[]).map(m=>({id:uid(),text:'',done:false,due:'',...m}))}));
  return s;
}
const LS='equity-v1';
function loadLocal(){try{const t=localStorage.getItem(LS);return t?migrate(JSON.parse(t)):null}catch(e){return null}}
function saveLocal(){if(DEMO)return;try{localStorage.setItem(LS,JSON.stringify(state))}catch(e){}}
let DEMO=(location.hash||'').toLowerCase()==='#demo';
let state=DEMO?makeExample():(loadLocal()||makeExample());
const ui={sel:null,tab:'signals',open:new Set(),focus:null};

/* ---------- math ---------- */
const D_=id=>state.domains.find(d=>d.id===id);
function metricProg(m){const e=m.entries;if(!e.length||!m.target)return null;const cur=avg(e.slice(-5).map(x=>x.v));
  if(m.dir==='down'){const start=e[0].v;if(start<=m.target)return cur<=m.target?1:clamp(m.target/cur);return clamp((start-cur)/(start-m.target))}
  return clamp(cur/m.target)}
function valProg(m,v){if(!m.target)return null;if(m.dir==='down'){const s=m.entries[0]?.v??v;if(s<=m.target)return v<=m.target?1:clamp(m.target/v);return clamp((s-v)/(s-m.target))}return clamp(v/m.target)}
function habitWeek(h,T=today()){let c=0;for(let i=0;i<7;i++)if(h.days[addDays(T,-i)])c++;return c}
function streak(h){const T=today();let i=h.days[T]?0:1,s=0;while(h.days[addDays(T,-i)]){s++;i++}return s}
function parts(d){const mp=d.metrics.map(metricProg).filter(x=>x!=null);return{sig:mp.length?avg(mp):null,rit:d.habits.length?avg(d.habits.map(h=>habitWeek(h)/7)):null,ms:d.milestones.length?d.milestones.filter(m=>m.done).length/d.milestones.length:null}}
function prog(d){const p=parts(d);const a=[p.sig,p.rit,p.ms].filter(x=>x!=null);return a.length?avg(a):0}
function lifeIndex(){const ds=state.domains.filter(d=>!d.muted);const tw=ds.reduce((s,d)=>s+(d.weight??.75),0);return tw?ds.reduce((s,d)=>s+prog(d)*(d.weight??.75),0)/tw:0}
function dayRaw(d,k){const p=[];if(d.habits.length)p.push(d.habits.filter(h=>h.days[k]).length/d.habits.length);
  for(const m of d.metrics){const e=m.entries.find(x=>x.d===k);if(e){const v=valProg(m,e.v);if(v!=null)p.push(v)}}return p.length?avg(p):0}
function series(d,n){const T=today(),out=[];let s=0;for(let i=n+9;i>=0;i--){const raw=dayRaw(d,addDays(T,-i));s=s*.55+raw*.45;if(i<n)out.push(s)}return out}// oldest..today
function momentum(d){const s=series(d,14);return avg(s.slice(7))-avg(s.slice(0,7))}
function lifeSeries(n){const ss=state.domains.filter(d=>!d.muted).map(d=>({w:d.weight??.75,s:series(d,n)}));const tw=ss.reduce((a,b)=>a+b.w,0)||1;return[...Array(n)].map((_,i)=>ss.reduce((a,b)=>a+b.s[i]*b.w,0)/tw)}

const ICON={x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>'};
const CHK='<svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7"/></svg>';
const ARR='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>';
const UPA='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 5l7 9H5z"/></svg>',DNA='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 19l7-9H5z"/></svg>';
const FL='<svg class="fl" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2c1 4 6 6 6 12a6 6 0 0 1-12 0c0-3 2-5 3-6 0 2 1 3 2 3 0-4-1-6 1-9z" fill="currentColor"/></svg>';
const dayDiff=(a,b)=>Math.round((parseKey(b)-parseKey(a))/864e5);
let HB=null;function iosTap(){try{if(!HB){const l=document.createElement('label');l.setAttribute('aria-hidden','true');l.style.cssText='position:fixed;left:-200px;top:0;width:1px;height:1px;overflow:hidden;opacity:0;pointer-events:none';const i=document.createElement('input');i.type='checkbox';i.setAttribute('switch','');i.tabIndex=-1;l.appendChild(i);document.body.appendChild(l);HB=l}HB.click()}catch(_){}}
const CANVIB=typeof navigator.vibrate==='function'&&!/iPhone|iPad|iPod/.test(navigator.userAgent);
const haptic=p=>{if(!state.settings.haptics)return;try{if(CANVIB)navigator.vibrate(p);else iosTap()}catch(_){}};
const OR={blobs:[],rip:[]};function syncBlobs(){}let wkSel=null;
function dayScore(k){const ds=state.domains.filter(d=>!d.muted);const tw=ds.reduce((s,d)=>s+(d.weight??.75),0)||1;return ds.reduce((s,d)=>s+dayRaw(d,k)*(d.weight??.75),0)/tw}
function moodOf(v){return v>=.75?'Bull':v>=.55?'Strong':v>=.4?'Neutral':v>=.25?'Soft':'Bear'}
function ticker(d){if(d.ticker)return d.ticker;const n=d.name.toUpperCase().replace(/[^A-Z]/g,'');if(n.length<=4)return n.padEnd(3,'X');let t=n[0]+n.slice(1).replace(/[AEIOU]/g,'');if(t.length<4)t=n.slice(0,4);return t.slice(0,4)}
const P=v=>(v*100).toFixed(2);
const cls=v=>v>.0005?'up':v<-.0005?'down':'';
const sgn=v=>(v>0?'+':v<0?'−':'')+Math.abs(v).toFixed(2);
function sparkSvg(vals,col,w=100){if(vals.length<2)return'<svg viewBox="0 0 100 34"></svg>';const lo=Math.min(...vals),hi=Math.max(...vals,lo+.02);const X=i=>i/(vals.length-1)*100,Y=v=>31-(v-lo)/(hi-lo)*28;const pts=vals.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');return`<svg class="spsv" viewBox="0 0 100 34" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="${col}" stroke-width="${w>100?2.4:2}" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/></svg>`}
/* ---------- persistence ---------- */
let dbRef=null,saveTimer=null,saving=false,again=false;
function setSync(s){$('#sync').dataset.s=s}
async function flush(){if(!dbRef||DEMO)return;if(saving){again=true;return}saving=true;setSync('saving');try{await dbRef.set({json:JSON.stringify(state),updatedAt:Date.now()});setSync('ok')}catch(e){setSync('')}saving=false;if(again){again=false;flush()}}
function commit(o={}){state.updatedAt=Date.now();saveLocal();clearTimeout(saveTimer);saveTimer=setTimeout(flush,250);if(!dbRef)setSync(DEMO?'demo':'ok');if(o.render!==false)renderAll()}
async function connect(){if(DEMO){setSync('demo');return}try{if(!window.claude||typeof window.claude.use!=='function'){setSync('ok');return}
  const[db,user]=await Promise.all([claude.use('db'),claude.use('user')]);if(!db||!user){setSync('ok');return}const id=await user.id();if(!id){setSync('ok');return}
  dbRef=db.doc('data/users/'+id+'/equity');const snap=await dbRef.get();
  if(snap.exists){const s=migrate(JSON.parse(snap.data().json||'null'));const localNewer=state.updatedAt&&(!s||!s.updatedAt||state.updatedAt>s.updatedAt)&&!state.example;if(s&&!localNewer){state=s;saveLocal();applyTheme();renderAll();syncBlobs(true)}setSync('ok');if(localNewer)flush()}else{await flush();setSync('ok')}
  const a=await claude.use('assets');if(a){PH.assets=a;renderPhoto()}}catch(e){setSync('ok')}}
const flushNow=()=>{saveLocal();if(dbRef){clearTimeout(saveTimer);flush()}};document.addEventListener('visibilitychange',()=>{if(document.hidden)flushNow()});addEventListener('pagehide',flushNow);
function applyTheme(){applyTheme2()}

/* ---------- daily frame ---------- */
const PH={assets:null,urls:{},busy:false};
const CAM='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-2.5h6L17 8h3v11H4z"/><circle cx="12" cy="13.2" r="3.6"/></svg>';
let IDBP=null;function idb(){return IDBP||(IDBP=new Promise((res,rej)=>{try{const r=indexedDB.open('equity-photos',1);r.onupgradeneeded=()=>r.result.createObjectStore('p');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}}))}
async function idbPut(k,b){const db=await idb();return new Promise((res,rej)=>{const t=db.transaction('p','readwrite');t.objectStore('p').put(b,k);t.oncomplete=res;t.onerror=()=>rej(t.error)})}
async function idbGet(k){try{const db=await idb();return await new Promise(res=>{const q=db.transaction('p').objectStore('p').get(k);q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null)})}catch(e){return null}}
const photos=()=>state.photos||(state.photos={});
function photoURL(k){const p=photos()[k];if(!p)return null;if(p.id)return'/_blob/'+p.id;if(PH.urls[k])return PH.urls[k];if(p.local&&!PH.urls['_'+k]){PH.urls['_'+k]=1;idbGet(p.local).then(b=>{if(b){PH.urls[k]=URL.createObjectURL(b);renderPhoto()}})}return null}
function photoStreak(){const T=today();let i=photos()[T]?0:1,s=0;while(photos()[addDays(T,-i)]){s++;i++}return s}
async function shrink(f){let src;try{src=await createImageBitmap(f,{imageOrientation:'from-image'})}catch(e){src=await new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=URL.createObjectURL(f)})}const w=src.width,h=src.height,k=Math.min(1,1600/Math.max(w,h));const c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);c.getContext('2d').drawImage(src,0,0,c.width,c.height);return new Promise(r=>c.toBlob(r,'image/jpeg',.86))}
async function addPhoto(k,f){if(PH.busy)return;PH.busy=true;renderPhoto();try{const blob=await shrink(f),old=photos()[k];let rec;
  if(PH.assets&&!DEMO){const r=await PH.assets.upload(blob);rec={id:r.id,cap:old?.cap||''}}else if(DEMO)rec={demo:1,cap:old?.cap||''};else{const key=k+'-'+Date.now();await idbPut(key,blob);rec={local:key,cap:old?.cap||''}}
  PH.urls[k]=URL.createObjectURL(blob);photos()[k]=rec;if(old?.id&&PH.assets)PH.assets.delete(old.id).catch(()=>{});PH.busy=false;commit({render:false});renderPhoto();haptic([10,30,14]);toast('Today is framed');requestAnimationFrame(()=>{const fr=$('.ph-frame');if(fr){fr.classList.remove('flash');void fr.offsetWidth;fr.classList.add('flash')}})}
  catch(e){PH.busy=false;renderPhoto();toast('That photo could not be saved. Try another one.')}}
function renderPhoto(){const box=$('#phBox');if(!box)return;const T=today(),u=photoURL(T),p=photos()[T],st=photoStreak();$('#phStreak').textContent=st?st+'-day streak':'One a day';
  const pick=(k,cls,inner)=>`<label class="${cls}">${inner}<input class="ph-in" type="file" accept="image/*" data-photo="${k}" aria-label="Add photo"></label>`;
  const days=[...Array(14)].map((_,i)=>addDays(T,i-13));
  box.innerHTML=`<div class="ph">${u?`<button class="ph-frame" data-action="ph-open" data-k="${T}"><img src="${esc(u)}" alt="Today's photo"></button>`:p?`<div class="ph-frame ph-load"></div>`:pick(T,'ph-frame ph-take',`<span class="ph-cam">${CAM}</span><b>${PH.busy?'Saving…':'Take today’s photo'}</b>`)}

  o.addEventListener('pointerup',end);o.addEventListener('pointercancel',end)})}
function holdHTML(){return`<div class="st-in"><h1 class="vt">Holdings</h1><p class="vs">${state.domains.length} areas of your life. Tap one for its chart and details.</p>
  <div class="hl">${state.domains.map((d,i)=>{const m=momentum(d)*100;return`<button class="hr rv zs" style="--i:${i%4}" data-action="open" data-d="${d.id}"><span class="av" style="--c:${esc(d.color)};--fg:${fgOf(d.color)}">${ticker(d)}</span><span class="nm"><b>${esc(d.name)}</b><span>${moodOf(prog(d))}${d.muted?' · paused':''}</span></span>${sparkSvg(series(d,30),m>=0?'var(--up)':'var(--down)')}<span class="pr ${cls(m/100)}"><b style="color:var(--ink)">${cu(prog(d)*100,2)}</b><span>${m>=0?'+':'−'}${Math.abs(m).toFixed(2)}</span></span></button>`}).join('')}</div>
  <button class="addh rv zs" data-action="new-area">+ Add a holding</button></div>`}
function deskHTML(){const all=lifeSeries(15),w=(all[all.length-1]-all[all.length-8])*100;const ds=state.domains.filter(d=>!d.muted).map(d=>({d,m:momentum(d)*100})).sort((a,b)=>b.m-a.m);
  const R=w>1.5?['Outperform','var(--up)']:w<-1.5?['Underperform','var(--down)']:['Hold','var(--ink)'];const lead=ds[0],lag=ds[ds.length-1];const mg=marginal().slice(0,4);
  return`<div class="st-in"><h1 class="vt">Analyst desk</h1><p class="vs">Your weekly read, your best moves, and where your habits lead.</p>
   <section class="rate zs" style="--rc:${R[1]}"><span class="eb">This week’s rating</span><div class="rw" aria-label="${R[0]}">${letters(R[0])}</div><p>LIFX ${w>=0?'gained':'lost'} <b class="${cls(w/100)}">${sgn(w)}</b> in seven days.${lead&&lead.m>0?` <b>${esc(lead.d.name)}</b> is leading, up ${lead.m.toFixed(1)}.`:''}${lag&&lag.m<0&&lag!==lead?` <b>${esc(lag.d.name)}</b> is the drag at ${lag.m.toFixed(1)}; a single order there moves the index most.`:' Keep your streaks running.'}</p></section>
   <div class="sec-h rv zs"><h3>Best moves now</h3><span class="eb">Impact on LIFX</span></div>
   <div class="moves">${mg.map((x,i)=>`<div class="mv rv zs" style="--i:${i}"><span class="rk">0${i+1}</span><div class="ml"><b>${esc(x.h.name)}</b><span><span class="tkr" style="--c:${esc(x.d.color)}">${ticker(x.d)}</span> <span class="up">+${x.gain.toFixed(2)}</span></span></div><button class="go" data-action="fill" data-d="${x.d.id}" data-h="${x.h.id}">Fill</button></div>`).join('')||`<div class="empty"><b>Every order is filled</b>Nothing left on today’s book.</div>`}</div>
   <div class="sec-h rv zs"><h3>Compounding</h3><span class="eb">Next 60 days</span></div>
   <section class="card proj rv zs"><span class="k">If you keep this pace, LIFX reaches</span><div class="pv"><b id="pvB">—</b><span id="pvD"></span></div><div class="pc" id="pcb"><canvas id="pc"></canvas></div>
    <div class="sl"><span>Orders a day</span><input class="rg" type="range" id="projR" min="0" max="10" step="1" value="5" aria-label="Orders a day"><b id="projN"></b></div><p id="projNote"></p></section>
   <div class="sec-h rv zs"><h3>Daily frame</h3><span class="eb" id="phStreak"></span></div><section class="card rv zs" id="phBox"></section></div>`}
let projV=null;
function mountDesk(quiet){const cf=curFill(),rg=$('#projR');rg.max=Math.max(1,cf.H);rg.value=projV!=null&&quiet?Math.min(projV,cf.H):Math.min(cf.H,Math.round(cf.avg));PC=makeChart($('#pcb'),$('#pc'),{axis:false});renderProj();rg.addEventListener('input',()=>{projV=+rg.value;renderProj();haptic(3)})}
function renderProj(){const rg=$('#projR');if(!rg||!PC)return;const n=+rg.value,cf=curFill();$('#projN').textContent=`${n}/${cf.H}`;rg.style.setProperty('--f',(cf.H?n/cf.H*100:0)+'%');
  const cur=LIFX(),tgt=steady(n),D=60,vals=[...Array(D+1)].map((_,t)=>tgt+(cur-tgt)*Math.exp(-t/7));PC.opts.color=tgt>=cur?TK().up:TK().down;PC.set(vals,null,true);
  const end=new Date();end.setDate(end.getDate()+D);const dl=(tgt-cur)*100;const pb=$('#pvB');const from=parseFloat(pb.textContent)||0,to=tgt*100,t0=performance.now();cancelAnimationFrame(pb._r);const st=nw=>{const k=Math.min(1,(nw-t0)/450),e=1-Math.pow(1-k,3);pb.textContent=(from+(to-from)*e).toFixed(2);if(k<1)pb._r=requestAnimationFrame(st)};pb._r=requestAnimationFrame(st);
  $('#pvD').innerHTML=`<span class="${cls(dl/100)}">${sgn(dl)}</span> by ${end.getDate()} ${MON[end.getMonth()]}`;
  $('#projNote').innerHTML=dl>.3?`Fill <b>${n}</b> of ${cf.H} orders a day and you climb <b>${sgn(dl)}</b>. Small orders compound.`:dl<-.3?`At <b>${n}</b> a day the index slides <b>${sgn(dl)}</b>. One more order a day turns it.`:`At <b>${n}</b> a day you hold steady. One more order a day starts the climb.`}

/* ---------- fill an order ---------- */
function fill(did,hid,el){const d=D_(did),h=d?.habits.find(x=>x.id===hid);if(!h)return;const k=today(),was=!!h.days[k];const before=LIFX();if(was)delete h.days[k];else h.days[k]=1;
  haptic(was?6:[8,24,12]);if(!was&&el&&!RM.matches)burst(el);commit({render:false});const after=LIFX();
  $$(`.ord[data-h="${hid}"]`).forEach(o=>{o.dataset.on=was?0:1;if(!was){o.classList.remove('just');void o.offsetWidth;o.classList.add('just')}});
  const{rt,rd}=todayCount();const pb=$('#pbar');if(pb){pb.style.setProperty('--w',(rt?rd/rt*100:0)+'%');const pn=$('#pnum');pn.textContent=`${rd}/${rt}`;pn.classList.remove('bump');void pn.offsetWidth;pn.classList.add('bump')}
  badge();updMini();
  if(!was&&rt&&rd===rt){setTimeout(celebrate,250);toast('Every order filled. A full day.')}else if(!was)toast(`${ticker(d)} filled · LIFX ${sgn((after-before)*100)}`);
  NAV.order.forEach(v=>{if(v!=='orders')DIRTY[v]=true});DIRTY.orders=NAV.v!=='orders';
  if(NAV.v==='home'||NAV.v==='desk'){const v=NAV.v;setTimeout(()=>{if(NAV.v===v)renderPane(v,'quiet')},was?0:650)}
  if(SH.kind==='area')renderArea()}
function tick(btn){fill(btn.dataset.d,btn.dataset.h,btn)}
function renderAll(){const n=new Date(),h=n.getHours();$('#appName').textContent=state.profile.name||'Equity';$('#greet').textContent=`${h<5?'Good night':h<12?'Good morning':h<18?'Good afternoon':'Good evening'} · ${DOW[n.getDay()].slice(0,3)} ${n.getDate()} ${MON[n.getMonth()]}`;
  NAV.order.forEach(v=>DIRTY[v]=true);renderPane(NAV.v,BUILT[NAV.v]?'quiet':'fresh');badge();updMini();if(SH.kind==='area')renderArea();if(SH.kind==='settings')renderSettings()}
function renderMain(){renderAll()}function renderHero(){renderAll()}function setFocus(id){if(id)openSheet('area',id)}

/* ---------- loop & boot ---------- */
let last=performance.now();
function frame(now){const dt=Math.min(50,now-last);last=now;if(!document.hidden){const hv=PANE.home.classList.contains('on'),dv=PANE.desk.classList.contains('on');if(IC&&hv&&IC.cv.isConnected)IC.draw(now,dt);if(PC&&dv&&PC.cv.isConnected)PC.draw(now,dt);if(HC&&SH.kind==='area'&&HC.cv.isConnected)HC.draw(now,dt)}requestAnimationFrame(frame)}
function drawHolding(d){const cv=$('#hc');if(!cv)return;const old=HC&&HC._d===d.id?HC:null;HC=makeChart(cv.parentElement,cv,{axis:true});HC._d=d.id;HC.opts.color=momentum(d)>=0?TK().up:TK().down;const s=series(d,90);
  if(old&&old.disp.length===s.length){HC.disp=old.disp.slice();HC.set(s,null,true);HC.t0=-1e9}else HC.set(s);const box=cv.parentElement;let lastI=-1;const mv=e=>{const i=HC.idx(e);if(i!==lastI&&lastI!==-1&&e.pointerType!=='mouse')haptic(2);lastI=i;HC.hover=i};box.onpointermove=mv;box.onpointerdown=mv;box.onpointerleave=box.onpointercancel=()=>{HC.hover=-1;lastI=-1}}
if(DEMO)demoPhotos();
applyTheme();PANE.home.className='pane on';renderAll();$('#v-home').classList.add('ent');
addEventListener('resize',()=>{if(IC){IC.size();IC._ck=''}if(PC)PC.size();if(HC&&HC.cv.isConnected)HC.size();if($('#map')?.classList.contains('in'))renderMap();moveDock();inkTo('#rng');onScroll()});
document.fonts?.ready.then(()=>{moveDock();inkTo('#rng')});
requestAnimationFrame(t=>{last=t;frame(t)});
setInterval(()=>{const k=today();if(k!==app._day){app._day=k;renderAll()}},60000);app._day=today();
setTimeout(connect,0);
})();
</script>
</body></html>
